<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 308" width="900" height="308" role="img" aria-label="About: I build Generative AI systems that hold up in production.">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.float{animation:float 8s ease-in-out infinite}
.shadow{animation:shadow 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.82);opacity:.6}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g transform="translate(0 40)"><text class="mono" x="2" y="24" font-size="13" letter-spacing="2.5"><tspan fill="#8B93FF">01</tspan><tspan dx="10" fill="#9198A1">ABOUT</tspan></text><rect x="98" y="19" width="802" height="1" fill="#3D444D"/><text x="0" y="72" font-size="19" fill="#F0F6FC">I build Generative AI systems that <tspan fill="#8B93FF" font-weight="600">hold up in production</tspan>:</text><text x="0" y="102" font-size="19" fill="#F0F6FC">RAG over real data, LLM agents with tool use and document intelligence</text><text x="0" y="132" font-size="19" fill="#F0F6FC">pipelines, on a solid base of Python, FastAPI and Next.js, shipped on AWS.</text><rect x="0" y="178" width="22" height="2" rx="1" fill="#8B93FF"/><text x="0" y="224" font-size="36" font-weight="700" letter-spacing="-1" fill="#F0F6FC">4</text><text x="0" y="252" font-size="14.5" fill="#9198A1">AI &amp; automation systems built</text><rect x="300" y="178" width="22" height="2" rx="1" fill="#8B93FF"/><text x="300" y="224" font-size="36" font-weight="700" letter-spacing="-1" fill="#F0F6FC">24% → 3%</text><text x="300" y="252" font-size="14.5" fill="#9198A1">malformed model outputs</text><rect x="274" y="178" width="1" height="78" fill="#3D444D"/><rect x="600" y="178" width="22" height="2" rx="1" fill="#8B93FF"/><text x="600" y="224" font-size="36" font-weight="700" letter-spacing="-1" fill="#F0F6FC">2×</text><text x="600" y="252" font-size="14.5" fill="#9198A1">recall at 19% lower cost</text><rect x="574" y="178" width="1" height="78" fill="#3D444D"/></g>
</svg>
